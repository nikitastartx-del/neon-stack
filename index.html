<!DOCTYPE html>
<html lang="en">
<head>
 <script src="https://telegram.org/js/telegram-web-app.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="NEON STACK - hold to brake, release to drop. Build the tallest neon tower with combos, golden blocks, levels and stats.">
<meta name="theme-color" content="#0b1026">
<title>NEON STACK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='20' width='24' height='8' rx='2' fill='%2300e5ff'/%3E%3Crect x='7' y='12' width='18' height='8' rx='2' fill='%237c4dff'/%3E%3Crect x='10' y='4' width='12' height='8' rx='2' fill='%23ff4d9d'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0b1026;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  canvas { position: fixed; inset: 0; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; }

  #mute {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    right: 14px;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff; font-size: 20px;
    pointer-events: auto; cursor: pointer;
    opacity: .8;
    transition: transform .15s ease, opacity .2s ease;
    z-index: 10;
  }
  #mute:active { transform: scale(.88); }
  #mute.off { color: rgba(255,255,255,.35); border-color: rgba(255,255,255,.1); }

  #level {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    left: 14px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
    opacity: .85;
  }
  #level.hot { animation: chipboom .4s ease; }

  #hud {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    left: 0; right: 0;
    text-align: center;
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  #hud.on { opacity: 1; }
  #score {
    font-size: clamp(56px, 12vw, 96px);
    font-weight: 800;
    line-height: 1;
    text-shadow: 0 0 24px rgba(120, 200, 255, .55), 0 2px 0 rgba(0,0,0,.35);
  }
  #score.pop { animation: pop .18s ease; }
  @keyframes pop { 50% { transform: scale(1.18); } }
  #combo {
    margin-top: 6px;
    font-size: clamp(15px, 3.4vw, 22px);
    font-weight: 700;
    letter-spacing: 3px;
    color: #ffe66d;
    text-shadow: 0 0 16px rgba(255, 220, 100, .8);
    opacity: 0;
  }
  #combo.show { animation: combofade .95s ease forwards; }
  @keyframes combofade {
    0% { opacity: 0; transform: translateY(8px) scale(.85); }
    18% { opacity: 1; transform: translateY(0) scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-10px); }
  }
  #chip {
    margin-top: 4px;
    font-size: clamp(14px, 3.2vw, 20px);
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffe66d;
    text-shadow: 0 0 16px rgba(255, 215, 90, .9);
    display: none;
  }
  #chip.hot { animation: chipboom .4s ease; }
  @keyframes chipboom { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: radial-gradient(ellipse at center, rgba(8, 10, 30, .38) 0%, rgba(5, 6, 20, .78) 100%);
    transition: opacity .3s ease;
  }
  .screen.hidden { opacity: 0; visibility: hidden; }
  .title {
    font-size: clamp(44px, 11vw, 92px);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #9be8ff 0%, #59a7ff 45%, #c86bff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(90, 160, 255, .55));
  }
  .subtitle { font-size: clamp(13px, 3vw, 17px); letter-spacing: 2px; color: rgba(255,255,255,.75); }
  .best { font-size: clamp(14px, 3.2vw, 19px); letter-spacing: 2px; color: #ffe66d; font-weight: 700; }
  .tap {
    margin-top: 22px;
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 800;
    letter-spacing: 4px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  .stats { display: flex; gap: 30px; margin-top: 6px; }
  .stat { text-align: center; }
  .stat .label { font-size: 12px; letter-spacing: 3px; color: rgba(255,255,255,.55); }
  .stat .value { font-size: clamp(32px, 7.5vw, 54px); font-weight: 800; }
  .small {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.55);
    font-weight: 600;
  }
  #newBest {
    display: none;
    padding: 6px 18px;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff4d9d, #ff9d4d);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 2px;
    box-shadow: 0 0 22px rgba(255, 110, 150, .6);
  }
  #newBest.show { display: block; animation: pop .3s ease; }

  #infoPanel { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:22px; background:rgba(5,8,25,.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); pointer-events:auto; z-index:30; }
  #infoPanel.show { display:flex; }
  #infoCard { width:min(92vw,430px); max-height:82vh; overflow:auto; padding:26px 22px; border-radius:24px; background:linear-gradient(180deg,rgba(20,28,65,.97),rgba(10,15,40,.97)); border:1px solid rgba(150,220,255,.22); box-shadow:0 0 50px rgba(0,220,255,.18); color:#fff; text-align:center; }
  #infoTitle { font-size:clamp(25px,7vw,38px); font-weight:900; letter-spacing:2px; margin-bottom:16px; }
  #infoBody { color:rgba(255,255,255,.82); line-height:1.65; font-size:14px; white-space:pre-line; }
  #infoClose { margin-top:20px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; border-radius:999px; padding:11px 22px; font-weight:800; cursor:pointer; }
  #tgUser { margin-top:8px; color:rgba(150,230,255,.95); font-weight:700; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="mute" title="Sound (M)">&#9835;</div>
  <div id="level">LV 1</div>
  <div id="hud">
    <div id="score">0</div>
    <div id="chip"></div>
    <div id="combo"></div>
  </div>

  <div id="menu" class="screen">
    <div class="title" id="menuTitle">NEON STACK</div>
    <div class="subtitle" id="menuSub">HOLD TO BRAKE &middot; RELEASE TO DROP</div>
    <div class="best" id="bestMenu"></div>
    <div class="tap">TAP TO PLAY</div>
  </div>

  <div id="over" class="screen hidden">
    <div class="title" style="font-size:clamp(30px,7vw,58px)">GAME OVER</div>
    <div id="newBest">NEW BEST!</div>
    <div class="stats">
      <div class="stat"><div class="label">SCORE</div><div class="value" id="finalScore">0</div></div>
      <div class="stat"><div class="label">BEST</div><div class="value" id="bestScore">0</div></div>
      <div class="stat"><div class="label">ACCURACY</div><div class="value" id="accScore">0%</div></div>
    </div>
    <div class="small" id="overFoot">COMBO &middot; 0 &nbsp;&nbsp; GAMES &middot; 0</div>
    <div class="tap">TAP TO RESTART</div>
  </div>
</div>
  <div id="infoPanel" aria-hidden="true">
    <div id="infoCard">
      <div id="infoTitle">NEON STACK</div>
      <div id="tgUser"></div>
      <div id="infoBody"></div>
      <button id="infoClose" type="button">CLOSE</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ==========================================================================
  //  WHITE-LABEL CONFIG  (resell / rebrand)
  //  - Change gameTitle / menuSubtitle for another brand.
  //  - hue = base accent color (0-360). Change favicon accordingly.
  //  - focus=false  -> classic tap-to-drop, no brake meter.
  //  - goldenBlocks=false -> no golden bonus blocks.
  //  - levels=false -> no level system / speed scales with height only.
  //  - onStart / onGameOver -> hooks for analytics or ad SDKs (called safely).
  // ==========================================================================
  var CONFIG = {
    gameTitle: "NEON STACK",
    menuSubtitle: "HOLD \u00B7 TO BRAKE   \u00B7   RELEASE \u00B7 DROP",
    hue: 195,
    focus: true,
    goldenBlocks: true,
    levels: true,
    maxDpr: 2,
    onStart: null,
    onGameOver: null
  };

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  var COS = Math.cos(Math.PI / 6);
  var SIN = Math.sin(Math.PI / 6);

  var BASE = 260;
  var BH = 54;
  var TOL = 13;
  var RANGE = 330;

  var W = 0, H = 0, DPR = 1;
  var baseScale = 1;

  var state = "menu";
  var stack = [];
  var moving = null;
  var debris = [];
  var sparks = [];
  var popups = [];
  var confs = [];
  var trail = [];
  var bgDots = [];
  var nebs = [];

  var score = 0;
  var best = 0;
  var bestCombo = 0;
  var combo = 0;
  var hueBase = CONFIG.hue;
  var golden = false;
  var goldenSince = 0;

  var level = 1;
  var blocks = 0;
  var perfects = 0;
  var games = 0;
  var totalBlocks = 0;
  var totalPerfects = 0;

  var cam = 0, camT = 0;
  var scale = 1, scaleT = 1;
  var shake = 0;
  var timeScale = 1;
  var flashA = 0;
  var overAt = 0;
  var lastT = 0;

  var hold = false;
  var activePtr = -1;
  var brake = 1;
  var focus = 1;
  var lightX = 0, lightZ = 0, lightA = 0;
  var hintFade = 0;
  var banner = null, bannerCol = "255,255,255", bannerT = 0;

  var shootingStar = { active: false, t: 3 + Math.random() * 4, x: 0, y: 0, vx: 0, vy: 0, life: 0 };

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var elInfoPanel = document.getElementById("infoPanel");
  var elInfoTitle = document.getElementById("infoTitle");
  var elInfoBody = document.getElementById("infoBody");
  var elTgUser = document.getElementById("tgUser");
  var elInfoClose = document.getElementById("infoClose");

  var LEADERBOARD_URL = "https://script.google.com/macros/s/AKfycby04O9hz5uEzK27Ju-hvgzdNCUWQjKPSb8Y6vPBi82lIILaFOT4Sk_iYXfU295uZ-6H/exec";

  function tgName() {
    try {
      var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (!u) return "Local player";
      return u.username ? "@" + u.username : ((u.first_name || "Player") + (u.last_name ? " " + u.last_name : ""));
    } catch (e) { return "Local player"; }
  }

  function sendScoreToLeaderboard(finalScore) {
    try {
      if (!tg || !tg.initDataUnsafe || !tg.initDataUnsafe.user) return;

      var u = tg.initDataUnsafe.user;
      if (!u.id || !finalScore || finalScore <= 0) return;

      var payload = JSON.stringify({
        type: "score",
        score: Number(finalScore),
        user: {
          id: u.id,
          username: u.username || "",
          name: ((u.first_name || "") + (u.last_name ? " " + u.last_name : "")).trim() || "Player"
        }
      });

      // sendBeacon avoids a browser CORS preflight and is ideal for a fire-and-forget score.
      if (navigator.sendBeacon) {
        var blob = new Blob([payload], { type: "text/plain;charset=UTF-8" });
        navigator.sendBeacon(LEADERBOARD_URL, blob);
      } else {
        fetch(LEADERBOARD_URL, {
          method: "POST",
          body: payload,
          mode: "no-cors",
          keepalive: true
        }).catch(function(){});
      }
    } catch (e) {}
  }

  function openInfo(kind) {
    if (kind === "profile") {
      var acc = totalBlocks > 0 ? Math.round(totalPerfects / totalBlocks * 100) : 0;
      elInfoTitle.textContent = "PROFILE";
      elTgUser.textContent = tgName();
      elInfoBody.textContent =
        "BEST SCORE\n" + best + "\n\n" +
        "GAMES\n" + games + "\n\n" +
        "BEST COMBO\n" + bestCombo + "\n\n" +
        "ACCURACY\n" + acc + "%";
    } else {
      elInfoTitle.textContent = "HOW TO PLAY";
      elTgUser.textContent = "";
      elInfoBody.textContent =
        "HOLD — slow the moving block.\n" +
        "RELEASE — drop the block.\n\n" +
        "Place blocks accurately to build your combo and score.\n\n" +
        "SPACE / ENTER / ARROW DOWN — play or drop\n" +
        "M — toggle sound";
    }
    elInfoPanel.classList.add("show");
    elInfoPanel.setAttribute("aria-hidden", "false");
  }

  function closeInfo() {
    elInfoPanel.classList.remove("show");
    elInfoPanel.setAttribute("aria-hidden", "true");
  }
  elInfoClose.addEventListener("click", closeInfo);
  elInfoPanel.addEventListener("click", function(e) { if (e.target === elInfoPanel) closeInfo(); });
  if (tg && tg.BackButton) {
    tg.BackButton.onClick(closeInfo);
  }

  function handleMiniAppRoute() {
    try {
      var q = new URLSearchParams(location.search);
      var action = (q.get("action") || "").toLowerCase();
      if (action === "play") { setTimeout(function(){ if (state === "menu") startGame(); }, 50); }
      else if (action === "profile") { setTimeout(function(){ openInfo("profile"); }, 50); }
      else if (action === "help") { setTimeout(function(){ openInfo("help"); }, 50); }
    } catch (e) {}
  }

  var muted = false;
  try { muted = localStorage.getItem("neon-stack-muted") === "1"; } catch (e) {}

  var elScore = document.getElementById("score");
  var elChip = document.getElementById("chip");
  var elCombo = document.getElementById("combo");
  var elHud = document.getElementById("hud");
  var elMenu = document.getElementById("menu");
  var elOver = document.getElementById("over");
  var elMute = document.getElementById("mute");
  var elLevel = document.getElementById("level");
  var elBestMenu = document.getElementById("bestMenu");
  var elFinalScore = document.getElementById("finalScore");
  var elBestScore = document.getElementById("bestScore");
  var elAccScore = document.getElementById("accScore");
  var elOverFoot = document.getElementById("overFoot");
  var elNewBest = document.getElementById("newBest");
  elMute.classList.toggle("off", muted);
  elMute.innerHTML = muted ? "&#10005;&#9835;" : "&#9835;";

  document.title = CONFIG.gameTitle;
  var metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute("content", CONFIG.gameTitle + " - hold to brake, release to drop. Free online stacking game.");
  var elMenuTitle = document.getElementById("menuTitle");
  if (elMenuTitle) elMenuTitle.textContent = CONFIG.gameTitle;
  var elMenuSub = document.getElementById("menuSub");
  if (elMenuSub) elMenuSub.textContent = CONFIG.menuSubtitle;
  elLevel.style.display = CONFIG.levels ? "" : "none";

  try {
    best = parseInt(localStorage.getItem("neon-stack-best"), 10) || 0;
    bestCombo = parseInt(localStorage.getItem("neon-stack-combo"), 10) || 0;
    games = parseInt(localStorage.getItem("neon-stack-games"), 10) || 0;
    totalBlocks = parseInt(localStorage.getItem("neon-stack-blocks"), 10) || 0;
    totalPerfects = parseInt(localStorage.getItem("neon-stack-perfects"), 10) || 0;
  } catch (e) {}
  function setBestMenu() {
    elBestMenu.textContent =
      (best > 0 ? "BEST \u00B7 " + best + "   " : "") +
      (bestCombo > 0 ? "COMBO \u00B7 " + bestCombo + "   " : "") +
      (games > 0 ? "GAMES \u00B7 " + games : "");
  }
  setBestMenu();

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr || 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    baseScale = Math.min(W / 720, H / 980);
    if (state !== "over") scaleT = baseScale;
  }
  window.addEventListener("resize", resize);
  resize();
  scale = baseScale;

  var i;
  for (i = 0; i < 60; i++) {
    bgDots.push({
      fx: Math.random(),
      fy: Math.random(),
      spd: 0.008 + Math.random() * 0.03,
      r: 0.5 + Math.random() * 1.7,
      a: 0.05 + Math.random() * 0.22,
      ph: Math.random() * Math.PI * 2
    });
  }
  for (i = 0; i < 3; i++) {
    nebs.push({
      fx: 0.15 + Math.random() * 0.7,
      fy: 0.1 + Math.random() * 0.35,
      r: 0.35 + Math.random() * 0.4,
      a: 0.10 + Math.random() * 0.10,
      hue: (hueBase + i * 95) % 360
    });
  }

  function makeBlock(x, z, w, d, y) {
    return { x: x, z: z, w: w, d: d, y: y, hue: 0, flash: 0, gold: false, squash: 0 };
  }

  function spawnMoving() {
    var prev = stack[stack.length - 1];
    var axis = (stack.length % 2 === 1) ? "x" : "z";
    var b = makeBlock(prev.x, prev.z, prev.w, prev.d, prev.y + BH);
    golden = false;
    goldenSince++;
    if (CONFIG.goldenBlocks && stack.length >= 6) {
      var force = goldenSince >= Math.max(8, 14 - level * 2);
      var roll = goldenSince >= 4 && Math.random() < Math.min(0.3, 0.10 + level * 0.02);
      if (force || roll) { golden = true; goldenSince = 0; }
    }
    b.gold = golden;
    b.hue = golden ? 46 : (hueBase + stack.length * 7) % 360;
    if (axis === "x") { b.x = -RANGE; } else { b.z = RANGE; }
    moving = b;
    moving.axis = axis;
    moving.dir = axis === "x" ? 1 : -1;
    moving.speed = Math.min((CONFIG.levels ? 300 + level * 28 : 300) + stack.length * 3, 820);
    trail.length = 0;
  }

  function resetGame() {
    stack = [makeBlock(0, 0, BASE, BASE, 0)];
    stack[0].hue = (hueBase + 350) % 360;
    debris = [];
    sparks = [];
    popups = [];
    confs = [];
    trail = [];
    score = 0;
    combo = 0;
    golden = false;
    goldenSince = 0;
    level = 1;
    blocks = 0;
    perfects = 0;
    brake = 1;
    focus = 1;
    cam = 0; camT = 0;
    scaleT = baseScale;
    timeScale = 1;
    flashA = 0;
    banner = null;
    hintFade = CONFIG.focus ? 1 : 0;
    elScore.textContent = "0";
    elChip.style.display = "none";
    elLevel.textContent = "LV 1";
    spawnMoving();
  }

  function setScore(v) {
    score = v;
    elScore.textContent = v;
    elScore.classList.remove("pop");
    void elScore.offsetWidth;
    elScore.classList.add("pop");
  }

  function updateChip() {
    if (combo >= 2) {
      elChip.textContent = "PERFECT \u00D7" + combo;
      elChip.style.display = "block";
      elChip.classList.remove("hot");
      void elChip.offsetWidth;
      elChip.classList.add("hot");
    } else {
      elChip.style.display = "none";
    }
  }

  function showCombo(n) {
    elCombo.textContent = n >= 4 ? "RAMPAGE \u00D7" + n : "PERFECT \u00D7" + n;
    elCombo.classList.remove("show");
    void elCombo.offsetWidth;
    elCombo.classList.add("show");
  }

  function showBanner(text, col) {
    banner = text;
    bannerCol = col || "255,255,255";
    bannerT = 0;
  }

  function addPopup(x, y, z, text, col, size) {
    popups.push({ x: x, y: y, z: z, text: text, col: col, size: size || 1, life: 0.95, max: 0.95, vy: 70 });
  }

  function levelUp(n) {
    level = n;
    elLevel.textContent = "LV " + level;
    elLevel.classList.remove("hot");
    void elLevel.offsetWidth;
    elLevel.classList.add("hot");
    showBanner("LEVEL " + level, "255,215,90");
    scaleT = baseScale * 1.08;
    focus = 1;
    sfxLevelUp();
    buzz(10);
  }

  function burstSparks(b, gold) {
    var n = gold ? 28 : 16;
    var col = gold ? "255,225,110" : "255,240,180";
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 120 + Math.random() * (gold ? 280 : 220);
      sparks.push({
        x: b.x + (Math.random() - 0.5) * b.w,
        y: b.y + BH,
        z: b.z + (Math.random() - 0.5) * b.d,
        vx: Math.cos(ang) * sp,
        vz: Math.sin(ang) * sp,
        vy: 60 + Math.random() * 200,
        life: 0.45 + Math.random() * 0.35,
        max: 0.8,
        col: col
      });
    }
  }

  function confettiBurst() {
    var cols = [0, 55, 120, 195, 265, 330];
    for (var i = 0; i < 130; i++) {
      confs.push({
        x: W / 2 + (Math.random() - 0.5) * 160,
        y: H * 0.35 + Math.random() * 40,
        vx: (Math.random() - 0.5) * 900,
        vy: -320 - Math.random() * 620,
        rot: Math.random() * Math.PI * 2,
        rv: (Math.random() - 0.5) * 14,
        size: 4 + Math.random() * 7,
        col: "hsl(" + cols[Math.floor(Math.random() * cols.length)] + ", 95%, 62%)",
        life: 1.6 + Math.random() * 0.9,
        max: 2.2
      });
    }
  }

  function drop() {
    if (!moving) return;
    var prev = stack[stack.length - 1];
    var a = moving.axis;
    var delta = a === "x" ? moving.x - prev.x : moving.z - prev.z;
    var size = a === "x" ? moving.w : moving.d;
    var overlap = size - Math.abs(delta);

    if (overlap <= 0) {
      debris.push({
        x: moving.x, z: moving.z, w: moving.w, d: moving.d, y: moving.y,
        hue: moving.hue, gold: moving.gold, vy: 0,
        rot: (Math.random() - 0.5) * 0.3,
        rv: (delta >= 0 ? 1 : -1) * (0.9 + Math.random() * 1.8),
        drift: (delta >= 0 ? 1 : -1) * (90 + Math.random() * 90), axis: a
      });
      moving = null;
      gameOver();
      return;
    }

    var perfect = Math.abs(delta) <= TOL;
    var nx = moving.x, nz = moving.z, nw = moving.w, nd = moving.d;
    var pts = 1;

    if (perfect) {
      combo++;
      pts = 1 + combo;
      nx = prev.x;
      nz = prev.z;
      if (combo >= 2) {
        nw = Math.min(nw + 14, BASE);
        nd = Math.min(nd + 14, BASE);
      }
      if (moving.gold) pts *= 5;
      if (combo > bestCombo) bestCombo = combo;
      sfxPerfect(combo, moving.gold);
      burstSparks({ x: nx, z: nz, w: nw, d: nd, y: moving.y }, moving.gold);
      shake = Math.min(shake + 4, 10);
      if (moving.gold) { addPopup(nx, moving.y + BH, nz, "GOLD \u00D7" + pts, "255,225,110", 1.5); buzz(15); }
      else buzz(5);
    } else {
      combo = 0;
      var c = a === "x" ? nx : nz;
      var low = Math.max(c - size / 2, (a === "x" ? prev.x : prev.z) - (a === "x" ? prev.w : prev.d) / 2);
      var high = Math.min(c + size / 2, (a === "x" ? prev.x : prev.z) + (a === "x" ? prev.w : prev.d) / 2);
      var keptCenter = (low + high) / 2;
      var cutSize = Math.abs(delta);
      var cutCenter = delta > 0 ? high + cutSize / 2 : low - cutSize / 2;
      if (a === "x") { nx = keptCenter; nw = high - low; } else { nz = keptCenter; nd = high - low; }
      debris.push({
        x: a === "x" ? cutCenter : nx,
        z: a === "x" ? nz : cutCenter,
        w: a === "x" ? cutSize : nw,
        d: a === "x" ? nd : cutSize,
        y: moving.y, hue: moving.hue, gold: moving.gold, vy: 0,
        rot: (Math.random() - 0.5) * 0.5,
        rv: (delta >= 0 ? 1 : -1) * (1 + Math.random() * 1.5),
        drift: (delta >= 0 ? 1 : -1) * (70 + Math.random() * 70), axis: a

      if (moving.gold) pts = 5;
      sfxPlace(moving.gold);
      shake = Math.min(shake + 2, 8);

    var placed = makeBlock(nx, nz, nw, nd, moving.y);
    placed.hue = moving.hue;
    placed.gold = moving.gold;
    placed.flash = perfect ? 1 : 0;
    placed.squash = perfect ? 1 : 0.65;
    stack.push(placed);
    blocks++;
    if (perfect) perfects++;

    if (perfect) {

      addPopup(nx, moving.y + BH, nz, "+" + pts, popCol, 1.35);
    } else {

    setScore(score + pts);
    camT = placed.y;
    lightX = nx; lightZ = nz; lightA = 1;

    if (CONFIG.levels) {

  }

    if (isBest) {

    }
    if (bestCombo > 0) {

    }
    games++;
    totalBlocks += blocks;
    totalPerfects += perfects;
    try {
      localStorage.setItem("neon-stack-games", String(games));
      localStorage.setItem("neon-stack-blocks", String(totalBlocks));
      localStorage.setItem("neon-stack-perfects", String(totalPerfects));
    } catch (e) {}
    setBestMenu();

    var acc = blocks > 0 ? Math.round(perfects / blocks * 100) : 0;
    elFinalScore.textContent = score;
    elBestScore.textContent = best;
    elAccScore.textContent = acc + "%";

  }

  function fallTower() {

    for (var j = 0; j < n; j++) {
      var b = stack[stack.length - 1 - j];
      var side = (j % 2 === 0) ? 1 : -1;
      debris.push({
        x: b.x, z: b.z, w: b.w, d: b.d, y: b.y, hue: b.hue, gold: b.gold, vy: 0,

  var NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];

      tone(1046.5, 0.16, "sine", 0.26);
      tone(1318.51, 0.22, "sine", 0.16, 0.05);
      tone(1567.98, 0.3, "sine", 0.12, 0.1);

      tone(85, 0.13, "sine", 0.32);
    }
  }
  function sfxPerfect(n, gold) {
    var f = NOTES[Math.min(n - 1, NOTES.length - 1)];
    tone(f, 0.16, "sine", 0.3);
    tone(f * 2, 0.22, "sine", 0.1, 0.02);

  function sfxStart() {
    tone(392, 0.09, "triangle", 0.2);
    tone(523.25, 0.09, "triangle", 0.2, 0.08);
    tone(659.25, 0.14, "triangle", 0.22, 0.16);
  }
  function sfxOver() {
    tone(320, 0.35, "sawtooth", 0.18, 0, 140);
    tone(160, 0.55, "sawtooth", 0.15, 0.14, 70);

  function sfxLevelUp() {

    tone(659.25, 0.1, "triangle", 0.2, 0.08);

    tone(1046.5, 0.22, "sine", 0.22, 0.24);
  }

  var SCALE = [261.63, 293.66, 329.63, 392.00, 440.00];
  var musicActive = false;
  var nextBeat = 0, beatIndex = 0;
  function scheduleBeat(idx, t) {
    try {
      var bar = Math.floor(idx / 8) % 4;
      var kick = [0, 4, 7, 5];
      var rootF = 110 * Math.pow(2, kick[bar] / 12);
      var d = Math.max(0.001, t - audioCtx.currentTime);
      if (idx % 4 === 0) tone(rootF, 0.5, "triangle", 0.09, d);
      if (idx % 8 === 4) tone(rootF * 2, 0.3, "triangle", 0.055, d);
      if (idx % 2 === 1) {

  }
  function startMusic() {

    beatIndex = 0;
    musicActive = true;
  }
  function stopMusic() { musicActive = false; }

  var shX = 0, shY = 0;
  function P(x, y, z) {
    return [
      W / 2 + shX + (x - z) * COS * scale,
      H * 0.64 + shY + ((x + z) * SIN - (y - cam)) * scale
    ];
  }

  function quad(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    ctx.lineTo(pts[1][0], pts[1][1]);
    ctx.lineTo(pts[2][0], pts[2][1]);
    ctx.lineTo(pts[3][0], pts[3][1]);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function quadStroke(pts, style, lw) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    ctx.lineTo(pts[1][0], pts[1][1]);
    ctx.lineTo(pts[2][0], pts[2][1]);
    ctx.lineTo(pts[3][0], pts[3][1]);
    ctx.closePath();
    ctx.strokeStyle = style;
    ctx.lineWidth = lw;
    ctx.stroke();
  }

  function drawBox(b, alpha, rot, glow) {
    var hw = b.w / 2, hd = b.d / 2;
    var sq = b.squash || 0;
    var y0 = b.y;
    var y1 = b.y + BH * (1 - 0.45 * sq);
    if (sq > 0) { hw *= 1 + 0.06 * sq; hd *= 1 + 0.06 * sq; }
    var h = b.hue, g = b.gold;
    var A = alpha === undefined ? 1 : alpha;
    var cx = b.x, cz = b.z;
    var C = [], T = [], B = [], ci;
    for (ci = 0; ci < 4; ci++) {
      var dx = (ci & 1) ? hw : -hw;
      var dz = (ci & 2) ? hd : -hd;
      var wx = b.x + dx, wz = b.z + dz;
      if (rot) {
        var s = Math.sin(rot), c = Math.cos(rot), tdx = wx - cx, tdz = wz - cz;
        wx = cx + tdx * c - tdz * s;
        wz = cz + tdx * s + tdz * c;
      }
      C.push([wx, wz]);
    }
    for (ci = 0; ci < 4; ci++) {
      T.push(P(C[ci][0], y1, C[ci][1]));
      B.push(P(C[ci][0], y0, C[ci][1]));
    }
    var sT = g ? 96 : 62, sR = g ? 88 : 55, sF = g ? 92 : 58;
    var lT = g ? 68 : 60, lR = g ? 46 : 40, lF = g ? 55 : 49;
    quad([T[0], T[1], T[3], T[2]], "hsla(" + h + "," + sT + "%," + lT + "%," + A + ")");
    quad([T[1], T[3], B[3], B[1]], "hsla(" + h + "," + sR + "%," + lR + "%," + A + ")");
    quad([T[2], T[3], B[3], B[2]], "hsla(" + h + "," + sF + "%," + lF + "%," + A + ")");
    var lw = Math.max(1, 1.2 * scale);
    if (A > 0.05) {
      var st = "hsla(" + h + ",95%,82%," + (A * (glow ? 0.95 : 0.5)).toFixed(3) + ")";
      quadStroke([T[0], T[1], T[3], T[2]], st, lw);
      ctx.beginPath();
      ctx.moveTo(T[3][0], T[3][1]); ctx.lineTo(B[3][0], B[3][1]);
      ctx.moveTo(T[2][0], T[2][1]); ctx.lineTo(B[2][0], B[2][1]);

      ctx.lineWidth = lw;

    }
  }

  function drawGhost() {
    if (state !== "playing" || !moving) return;
    var prev = stack[stack.length - 1];
    var a = moving.axis;
    var delta = a === "x" ? moving.x - prev.x : moving.z - prev.z;
    var size = a === "x" ? moving.w : moving.d;
    var overlap = size - Math.abs(delta);
    if (overlap <= 0) return;
    var c = a === "x" ? moving.x : moving.z;
    var half = a === "x" ? prev.w / 2 : prev.d / 2;
    var bp = a === "x" ? prev.x : prev.z;
    var low = Math.max(c - size / 2, bp - half);
    var high = Math.min(c + size / 2, bp + half);
    var perfect = Math.abs(delta) <= TOL;
    var x = a === "x" ? (low + high) / 2 : moving.x;
    var z = a === "x" ? moving.z : (low + high) / 2;
    var w = a === "x" ? high - low : moving.w;
    var d = a === "x" ? moving.d : high - low;
    var hw = w / 2, hd = d / 2, y = moving.y;
    var col = perfect ? "255,215,90" : "150,215,255";
    quad([P(x - hw, y, z - hd), P(x + hw, y, z - hd), P(x + hw, y, z + hd), P(x - hw, y, z + hd)],
      "rgba(" + col + "," + (perfect ? "0.30" : "0.12") + ")");
    quadStroke([P(x - hw, y, z - hd), P(x + hw, y, z - hd), P(x + hw, y, z + hd), P(x - hw, y, z + hd)],
      "rgba(" + col + "," + (perfect ? "0.85" : "0.4") + ")", perfect ? 2.4 : 1.3);

  function line3d(x1, z1, x2, z2, style, lw) {

    ctx.lineWidth = lw;

  function update(rdt) {

    var dt = rdt * timeScale;
    flashA = Math.max(0, flashA - rdt * 2.4);
    if (bannerT < 1.3) bannerT += rdt;
    else if (banner) banner = null;

    if (musicActive && audioCtx) {
      while (nextBeat < audioCtx.currentTime + 0.6) {

        nextBeat += 0.42;
        beatIndex++;
      }
    }

    if (state === "playing") {
      var slow = CONFIG.focus && hold && focus > 0.01 && moving;
      var target = slow ? 0.32 : 1;
      brake += (target - brake) * Math.min(1, rdt * (slow ? 7 : 4));

    } else {

    }
    hintFade = Math.max(0, hintFade - rdt * 0.13);

    if (moving && (state === "playing" || state === "menu")) {
      var eff = moving.speed * (state === "playing" ? brake : 1);

      pos += moving.dir * eff * dt;

    var i;
    for (i = 0; i < stack.length; i++) {

    }

    if (moving && state === "playing") {
      trail.push({ x: moving.x, z: moving.z, y: moving.y, w: moving.w, d: moving.d, hue: moving.hue, gold: moving.gold, life: 0.5 });
      if (trail.length > 15) trail.shift();
    }
    for (i = trail.length - 1; i >= 0; i--) {
      trail[i].life -= rdt * 2.2;
      if (trail[i].life <= 0) trail.splice(i, 1);
    }

    for (i = debris.length - 1; i >= 0; i--) {
      var db = debris[i];
      if (db.delay > 0) {
        db.delay -= rdt;
        if (db.delay > 0) continue;
        db.vy = db.startUp || 0;
      }
      db.vy += 2100 * dt;
      db.y -= db.vy * dt;
      db.rot += db.rv * dt;

    for (i = sparks.length - 1; i >= 0; i--) {

    for (i = confs.length - 1; i >= 0; i--) {

      cf.life -= dt;
      cf.vy += 1500 * dt;
      cf.x += cf.vx * dt;
      cf.y += cf.vy * dt;
      cf.rot += cf.rv * dt;

      nb.hue = (nb.hue + dt * 4) % 360;
    }

    if (state === "playing" && moving) {
      lightX = moving.x;
      lightZ = moving.z;
      lightA += ((hold ? 1 : 0.55) - lightA) * Math.min(1, rdt * 6);
    } else {
      lightA = Math.max(0, lightA - rdt * 1.2);
    }

    if (shootingStar.active) {
      shootingStar.x += shootingStar.vx * rdt;
      shootingStar.y += shootingStar.vy * rdt;
      shootingStar.life -= rdt;
      if (shootingStar.life <= 0) shootingStar.active = false;
    } else {
      shootingStar.t -= rdt;
      if (shootingStar.t <= 0) {
        shootingStar.active = true;
        shootingStar.t = 4 + Math.random() * 7;
        shootingStar.x = W * 0.6 + Math.random() * W * 0.4;
        shootingStar.y = H * 0.06 + Math.random() * H * 0.2;
        var ang = Math.PI * (0.12 + Math.random() * 0.16);
        shootingStar.vx = -Math.cos(ang) * 850;
        shootingStar.vy = Math.sin(ang) * 850;
        shootingStar.life = 0.7;
      }
    }
  }

  function renderBloom() {
    if (stack.length < 1) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var i, b, pt, rad, gr;
    var n = stack.length;
    for (i = Math.max(1, n - 14); i < n; i++) {
      b = stack[i];
      pt = P(b.x, b.y + BH, b.z);
      if (pt[1] < -80 || pt[1] > H + 80) continue;
      rad = Math.max(30, b.w * scale * 0.5);
      var ga = b.gold ? 0.85 : (i === n - 1 ? 0.4 : 0.16);
      gr = ctx.createRadialGradient(pt[0], pt[1], rad * 0.15, pt[0], pt[1], rad * 1.7);
      gr.addColorStop(0, "hsla(" + (b.gold ? 46 : b.hue) + ",100%,60%,0.5)");
      gr.addColorStop(0.6, "hsla(" + (b.gold ? 46 : b.hue) + ",100%,55%," + (ga * 0.22).toFixed(3) + ")");
      gr.addColorStop(1, "hsla(" + (b.gold ? 46 : b.hue) + ",100%,50%,0)");
      ctx.fillStyle = gr;
      ctx.fillRect(pt[0] - rad * 1.7, pt[1] - rad * 1.7, rad * 3.4, rad * 3.4);
    }
    if (moving) {
      pt = P(moving.x, moving.y + BH, moving.z);
      rad = Math.max(44, moving.w * scale * 0.85);
      var mg = 0.45 + (hold ? 0.3 : 0) + (moving.gold ? 0.25 : 0);
      gr = ctx.createRadialGradient(pt[0], pt[1], rad * 0.15, pt[0], pt[1], rad * 1.5);
      gr.addColorStop(0, "hsla(" + (moving.gold ? 46 : moving.hue) + ",100%,62%,0.55)");
      gr.addColorStop(0.7, "hsla(" + (moving.gold ? 46 : moving.hue) + ",100%,55%," + (mg * 0.25).toFixed(3) + ")");
      gr.addColorStop(1, "hsla(" + (moving.gold ? 46 : moving.hue) + ",100%,50%,0)");
      ctx.fillStyle = gr;
      ctx.fillRect(pt[0] - rad * 1.5, pt[1] - rad * 1.5, rad * 3, rad * 3);
    }
    ctx.restore();
  }

  function drawFocusBar() {
    var bw = Math.min(230, W * 0.42), bh = 7, x = 16, y = H - 22;
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.fillRect(x, y, bw, bh);
    var col = focus > 0.25 ? "70,215,255" : "255,90,90";
    if (focus > 0) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(" + col + ",0.9)";
      ctx.fillRect(x + 1, y + 1, Math.max(0, (bw - 2) * focus), bh - 2);
      ctx.restore();
    }
    ctx.font = "600 11px 'Segoe UI', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillText("FOCUS", x, y - 6);
    if (focus <= 0.05) {
      ctx.fillStyle = "rgba(255,90,90," + (0.5 + 0.5 * Math.sin(performance.now() * 0.01)) + ")";
      ctx.fillText("RECHARGE", x + bw - 46, y - 6);
    }
  }

  function render() {
    var hueBg = (hueBase + stack.length * 5) % 360;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "hsl(" + hueBg + ", 48%, 9%)");
    g.addColorStop(0.55, "hsl(" + ((hueBg + 30) % 360) + ", 52%, 15%)");
    g.addColorStop(1, "hsl(" + ((hueBg + 55) % 360) + ", 55%, 21%)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var i, p, nb;
    for (i = 0; i < nebs.length; i++) {
      nb = nebs[i];
      var nx = nb.fx * W, ny = nb.fy * H, nr = nb.r * W * 0.9;
      var ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0, "hsla(" + nb.hue + ", 70%, 45%, " + nb.a + ")");
      ng.addColorStop(1, "hsla(" + nb.hue + ", 70%, 45%, 0)");
      ctx.fillStyle = ng;
      ctx.fillRect(nx - nr, ny - nr, nr * 2, nr * 2);
    }

    if (shootingStar.active) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      var sx2 = shootingStar.x - shootingStar.vx * 0.09, sy2 = shootingStar.y - shootingStar.vy * 0.09;
      var sg = ctx.createLinearGradient(shootingStar.x, shootingStar.y, sx2, sy2);
      sg.addColorStop(0, "rgba(255,255,255," + (shootingStar.life * 0.9).toFixed(3) + ")");
      sg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = sg;
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(shootingStar.x, shootingStar.y);
      ctx.lineTo(sx2, sy2);
      ctx.stroke();
      ctx.restore();
    }

    for (i = 0; i < bgDots.length; i++) {
      var dot = bgDots[i];
      var tw = 0.6 + 0.4 * Math.sin(dot.ph);
      ctx.beginPath();
      ctx.arc(dot.fx * W, dot.fy * H, dot.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(190, 215, 255, " + (dot.a * tw).toFixed(3) + ")";
      ctx.fill();
    }

    var half = 4;
    var step = BASE;
    var k;
    for (k = -half; k <= half; k++) {
      line3d(k * step, -half * step, k * step, half * step, "rgba(120,160,255,0.07)", 1);
      line3d(-half * step, k * step, half * step, k * step, "rgba(120,160,255,0.07)", 1);
    }

    var base = stack[0];
    var sc = P(base.x, -4, base.z);
    ctx.beginPath();
    ctx.ellipse(sc[0], sc[1], base.w * COS * scale * 0.72, base.w * SIN * scale * 0.62, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();

    if (lightA > 0.02) {
      var lp = P(lightX, -2, lightZ);
      var lrad = Math.max(50, BASE * 0.8 * scale);
      var lg = ctx.createRadialGradient(lp[0], lp[1], 0, lp[0], lp[1], lrad);
      lg.addColorStop(0, "rgba(120,220,255," + (lightA * 0.22).toFixed(3) + ")");
      lg.addColorStop(1, "rgba(120,220,255,0)");
      ctx.fillStyle = lg;
      ctx.fillRect(lp[0] - lrad, lp[1] - lrad, lrad * 2, lrad * 2);
    }

    for (i = 0; i < stack.length; i++) drawBox(stack[i]);

    for (i = trail.length - 1; i >= 0; i--) {
      var tr = trail[i];
      var ta = Math.max(0, tr.life * 0.26);
      drawBox(tr, ta, 0, false);
    }

    drawGhost();

    for (i = debris.length - 1; i >= 0; i--) {
      var db = debris[i];
      var fade = Math.max(0, Math.min(1, 1 - (cam - 650 - db.y) / 500));
      drawBox(db, fade, db.rot, false);
    }

    if (moving) drawBox(moving, 1, 0, true);

    if (CONFIG.focus && hold && moving && state === "playing") {
      var hp = P(moving.x, moving.y + BH, moving.z);
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(150,235,255,0.75)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(hp[0], hp[1], Math.max(26, moving.w * COS * scale * 0.62), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    for (i = 0; i < sparks.length; i++) {
      var s = sparks[i];
      p = P(s.x, s.y, s.z);
      ctx.beginPath();
      ctx.arc(p[0], p[1], Math.max(1.2, 3 * scale), 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + s.col + "," + (s.life / s.max).toFixed(3) + ")";
      ctx.fill();
    }

    for (i = 0; i < popups.length; i++) {
      var pp = popups[i];
      p = P(pp.x, pp.y, pp.z);
      var kp = pp.life / pp.max;
      var fs = Math.round((14 + 12 * pp.size) * Math.min(1.4, Math.max(0.8, scale)));
      ctx.font = "800 " + fs + "px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(" + pp.col + ",0.9)";
      ctx.shadowBlur = 10 * scale;
      ctx.fillStyle = "rgba(" + pp.col + "," + kp.toFixed(3) + ")";
      ctx.fillText(pp.text, p[0], p[1] - (1 - kp) * 30);
      ctx.shadowBlur = 0;
      ctx.textBaseline = "alphabetic";
    }

    if (confs.length > 0) {
      for (i = 0; i < confs.length; i++) {
        var cf = confs[i];
        ctx.save();
        ctx.translate(cf.x, cf.y);
        ctx.rotate(cf.rot);
        ctx.globalAlpha = Math.max(0, Math.min(1, cf.life / cf.max));
        ctx.fillStyle = cf.col;
        ctx.fillRect(-cf.size / 2, -cf.size / 2, cf.size, cf.size * 0.6);
        ctx.restore();
      }
    }

    renderBloom();

    var v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(0,0,10,0.42)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    if (banner) {
      var ba = Math.max(0, 1 - bannerT / 1.25);
      var bs = Math.round(clamp(30 + bannerT * 26, 30, 64));
      ctx.font = "900 " + bs + "px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,0.6)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "rgba(" + bannerCol + "," + ba.toFixed(3) + ")";
      ctx.fillText(banner, W / 2, H * 0.32);
      ctx.shadowBlur = 0;
      ctx.textBaseline = "alphabetic";
    }

    if (hintFade > 0 && state === "playing") {
      var ha = hintFade * 0.85;
      ctx.font = "600 13px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255," + ha.toFixed(3) + ")";
      ctx.fillText("HOLD \u2013 SLOW   \u00B7   RELEASE \u2013 DROP", W / 2, H - 46);
    }

    if (state === "playing" && CONFIG.focus) drawFocusBar();

    if (flashA > 0) {
      ctx.fillStyle = "rgba(255,255,255," + flashA.toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function frame(now) {
    var rdt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    update(rdt);
    render();
    requestAnimationFrame(frame);
  }

  resetGame();
  handleMiniAppRoute();
  requestAnimationFrame(function (t) { lastT = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
